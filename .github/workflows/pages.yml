name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/ci.yml'
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'IMPLEMENTATION.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'examples/**'
      - 'pkg/snowsdk/**'
      - 'benchmarks/performance-limits.json'
      - 'scripts/build-pages.sh'
      - 'scripts/check-pages-output.py'
      - 'scripts/tests/test_pages.py'
      - 'scripts/tests/test_pages_output.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9'

      - name: Prepare documentation source
        run: ./scripts/build-pages.sh "$GITHUB_WORKSPACE/_pages_source"

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./_pages_source
          destination: ./_site

      - name: Validate rendered documentation
        run: python3 scripts/check-pages-output.py ./_site --base-path /snow-core

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
