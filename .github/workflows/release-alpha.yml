name: Alpha release

on:
  push:
    tags:
      - 'v*-alpha*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  metadata:
    name: Validate alpha tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - id: meta
        name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]; then
            echo "unsupported alpha tag: $tag" >&2
            echo "expected vMAJOR.MINOR.PATCH-alpha.N" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$tag"
          test "$(git cat-file -t "refs/tags/$tag")" = "tag" || {
            echo "alpha releases require an annotated tag" >&2
            exit 1
          }
          version="${tag#v}"
          grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "CHANGELOG.md must contain a dated $version heading" >&2
            exit 1
          }
          if [[ -n "$(git ls-files .snow)" ]]; then
            echo "release tags must not contain project-local .snow state" >&2
            git ls-files .snow >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs:
      - verify
      - metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0-rc.3'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Build release binary
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          root="snow_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$root"
          go build \
            -trimpath \
            -ldflags="-s -w -X github.com/elmissouri16/snow-core/internal/buildinfo.Version=${VERSION}" \
            -o "dist/$root/snow" \
            ./cmd/snow
          chmod 0755 "dist/$root/snow"
          cp LICENSE README.md "dist/$root/"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH:-0}" \
            -C dist -cf - "$root" | gzip -n -9 > "dist/${root}.tar.gz"
          rm -rf "dist/$root"

      - name: Smoke-test Linux amd64 release binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/snow_${VERSION}_linux_amd64.tar.gz"
          mkdir -p smoke
          tar -xzf "$archive" -C smoke
          binary="$PWD/smoke/snow_${VERSION}_linux_amd64/snow"
          test "$("$binary" version)" = "$VERSION"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          SNOW_HOME="$work/home" "$binary" \
            --provider fake --no-session -p "alpha release smoke test"

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Create checksums
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum snow_*.tar.gz | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub prerelease
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Snow $TAG"
