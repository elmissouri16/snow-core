name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # setup-go currently drops rc suffixes when parsing go.mod. Keep this
          # semver-form prerelease synchronized with the root/module go lines.
          go-version: '1.27.0-rc.3'
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            examples/sdk/go.sum

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        if: runner.os == 'Linux'
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9'

      - name: Test support scripts
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Test installer on macOS
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/tests -p 'test_install.py' -v

      - name: Build snow
        if: runner.os == 'Linux'
        shell: bash
        run: go build -trimpath -o "$RUNNER_TEMP/snow" ./cmd/snow

      - name: Smoke-test snow
        if: runner.os == 'Linux'
        shell: bash
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          SNOW_HOME="$work/home" "$RUNNER_TEMP/snow" \
            --provider fake --no-session -p "CI lifecycle smoke test"

      - name: Test standalone Go SDK example
        working-directory: examples/sdk
        run: go test ./...

      - name: Run standalone Go SDK example
        if: runner.os == 'Linux'
        working-directory: examples/sdk
        run: go run . -provider fake -prompt "CI lifecycle smoke test"

  performance:
    name: Performance regression guard (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0-rc.3'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9'

      - name: Test benchmark guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_benchmarks.py' -v

      - name: Check benchmark regression ceilings
        run: python3 scripts/check_benchmarks.py

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0-rc.3'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Test internal runtime and Go SDK with race detector
        run: go test -race ./internal/... ./pkg/snowsdk -count=1

  cross-build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
        goarch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0-rc.3'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Cross-build Snow without cgo
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "$RUNNER_TEMP/snow" ./cmd/snow

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0-rc.3'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan reachable Go vulnerabilities
        run: |
          "$RUNNER_TEMP/bin/govulncheck" ./...
