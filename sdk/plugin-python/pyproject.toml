[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-plugin"
version = "0.1.0.dev0"
description = "Local Python SDK for authoring Snow protocol-v2 plugins (private, unpublished)"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }
keywords = ["snow", "plugin", "jsonrpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.readme]
text = "Private local SDK for authoring Snow protocol-v2 plugins. See docs/plugin-protocol.md for the wire contract. This package is not published."
content-type = "text/markdown"

[tool.setuptools]
packages = ["snow_plugin"]

[tool.setuptools.package-dir]
snow_plugin = "src/snow_plugin"

[tool.setuptools.package-data]
snow_plugin = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
