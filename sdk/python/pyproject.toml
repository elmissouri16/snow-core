[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-core-sdk"
version = "0.1.0.dev0"
description = "Async Python client for the Snow coding-agent RPC process"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "snow-core contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snow_sdk = ["py.typed"]
